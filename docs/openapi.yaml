openapi: 3.1.0
info:
  title: Blog API
  version: 2.0.0
  description: |
    A beginner-friendly reference for the Blog API.

    Start with **POST /auth/register** and **POST /auth/login**. Login gives
    you an access token. Use that token with the lock button in `/docs` before
    trying protected endpoints such as blogs, comments, and likes.
servers:
  - url: http://localhost:3000/api/v2
    description: Local development server
tags:
  - name: Authentication
    description: Create an account, log in, refresh a token, or log out.
  - name: Users
    description: Read or update user profiles. Some actions require an admin.
  - name: Blogs
    description: Read blog posts. Only admins can create, edit, or delete them.
  - name: Comments
    description: Read, add, edit, or delete comments on a blog.
  - name: Likes
    description: Add or remove your like from a blog.
paths:
  /:
    get:
      tags: [Authentication]
      summary: Check the API version
      description: A quick, public check that the version 2 API router is available.
      responses:
        '200':
          description: The API router is available
  /auth/register:
    post:
      tags: [Authentication]
      summary: Create a normal user account
      description: Create an account with an email address and password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in and receive an access token plus an HttpOnly refresh cookie
      description: Use the returned access token in the Authorization header for protected requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/AuthError' }
  /auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Exchange the signed refresh-token cookie for a new access token
      description: Your browser sends the signed refresh-token cookie automatically.
      responses:
        '200': { $ref: '#/components/responses/AccessTokenSuccess' }
        '401': { $ref: '#/components/responses/AuthError' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Remove the current refresh-token session and clear its cookie
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /users/current:
    get:
      tags: [Users]
      summary: Get the signed-in user
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    put:
      tags: [Users]
      summary: Update the signed-in user's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateInput' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Users]
      summary: Delete the signed-in user and related data
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /users:
    get:
      tags: [Users]
      summary: List users (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/Limit' },
          { $ref: '#/components/parameters/Offset' },
        ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /users/{userId}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get:
      tags: [Users]
      summary: Get one user (admin only)
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Users]
      summary: Delete one non-admin user (admin only)
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /blogs:
    get:
      tags: [Blogs]
      summary: List visible blogs
      description: Use `limit` and `offset` to read results a page at a time.
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/Limit' },
          { $ref: '#/components/parameters/Offset' },
        ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Blogs]
      summary: Create a blog (admin only)
      description: Send form fields. `banner_image` is optional and must be JPEG, PNG, or WEBP.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/BlogInput' }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /blogs/{slug}:
    get:
      tags: [Blogs]
      summary: Get one blog by slug
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /blogs/user/{userId}:
    get:
      tags: [Blogs]
      summary: List a user's visible blogs
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/UserId' },
          { $ref: '#/components/parameters/Limit' },
          { $ref: '#/components/parameters/Offset' },
        ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /blogs/{blogId}:
    parameters: [{ $ref: '#/components/parameters/BlogId' }]
    put:
      tags: [Blogs]
      summary: Update a blog (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/BlogInput' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Blogs]
      summary: Delete a blog (admin only)
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Blog deleted } }
  /comments/blog/{blogId}:
    parameters: [{ $ref: '#/components/parameters/BlogId' }]
    get:
      tags: [Comments]
      summary: List a blog's comments
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/Limit' },
          { $ref: '#/components/parameters/Offset' },
        ]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Comments]
      summary: Add a comment
      description: A comment contains one non-empty `content` field.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /comments/{commentId}:
    parameters: [{ $ref: '#/components/parameters/CommentId' }]
    put:
      tags: [Comments]
      summary: Update your comment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Comments]
      summary: Delete your comment or any comment as an admin
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /likes/blog/{blogId}:
    parameters: [{ $ref: '#/components/parameters/BlogId' }]
    post:
      tags: [Likes]
      summary: Like a published blog
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Likes]
      summary: Remove your like from a blog
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      {
        name: userId,
        in: path,
        required: true,
        schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' },
      }
    BlogId:
      {
        name: blogId,
        in: path,
        required: true,
        schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' },
      }
    CommentId:
      {
        name: commentId,
        in: path,
        required: true,
        schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' },
      }
    Slug:
      {
        name: slug,
        in: path,
        required: true,
        schema: { type: string, example: my-first-blog-a1b2c3 },
      }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
      }
    Offset:
      {
        name: offset,
        in: query,
        schema: { type: integer, minimum: 0, default: 0 },
      }
  schemas:
    RegisterInput:
      type: object
      description: The smallest body needed to create an account.
      required: [email, password]
      properties:
        email: { type: string, format: email, example: learner@example.com }
        password:
          type: string
          format: password
          minLength: 8
          example: safe-password-123
    LoginInput: { $ref: '#/components/schemas/RegisterInput' }
    UserUpdateInput:
      type: object
      description: Send only the profile fields you want to change.
      properties:
        username: { type: string, maxLength: 20, example: learner }
        email: { type: string, format: email, example: learner@example.com }
        firstName: { type: string, maxLength: 20, example: Ada }
        lastName: { type: string, maxLength: 20, example: Lovelace }
    BlogInput:
      type: object
      description: Form data for a blog. The image field is optional.
      required: [title, content]
      properties:
        title: { type: string, maxLength: 180, example: My first blog }
        content: { type: string, example: This is my first post. }
        status: { type: string, enum: [draft, published], example: draft }
        banner_image: { type: string, format: binary }
    CommentInput:
      type: object
      required: [content]
      properties:
        content:
          { type: string, maxLength: 1000, example: Thanks for sharing this. }
    SuccessResponse:
      type: object
      description: The common shape of a successful JSON response.
      properties:
        message: { type: string, example: Login successful }
        data:
          description: The endpoint-specific result. Its exact shape depends on the endpoint.
    ErrorResponse:
      type: object
      description: The common shape of an error response.
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: ValidationError }
            message:
              { type: string, example: A clear explanation of the problem }
  responses:
    Success:
      description: Request completed successfully
      content:
        {
          application/json:
            { schema: { $ref: '#/components/schemas/SuccessResponse' } },
        }
    AuthSuccess:
      description: Authentication succeeded and also sets a signed HttpOnly refresh cookie
      content:
        {
          application/json:
            { schema: { $ref: '#/components/schemas/SuccessResponse' } },
        }
    AccessTokenSuccess:
      description: A new access token was issued
      content:
        {
          application/json:
            { schema: { $ref: '#/components/schemas/SuccessResponse' } },
        }
    ValidationError:
      description: Input failed validation
      content:
        {
          application/json:
            { schema: { $ref: '#/components/schemas/ErrorResponse' } },
        }
    AuthError:
      description: Authentication failed
      content:
        {
          application/json:
            { schema: { $ref: '#/components/schemas/ErrorResponse' } },
        }
